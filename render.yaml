services:
  # ── Laravel Backend ──────────────────────────────────────────────
  - type: web
    name: claro-backend
    runtime: php
    rootDir: backend
    buildCommand: |
      composer install --no-dev --optimize-autoloader
      php artisan config:cache
      php artisan route:cache
      php artisan view:cache
      php artisan migrate --force
    startCommand: php artisan serve --host=0.0.0.0 --port=$PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        fromService:
          type: web
          name: claro-backend
          property: host
      - key: DB_CONNECTION
        value: sqlite
      - key: SESSION_DRIVER
        value: cookie
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: SANCTUM_STATEFUL_DOMAINS
        fromService:
          type: static
          name: claro-frontend
          property: host
      - key: FRONTEND_URL
        fromService:
          type: static
          name: claro-frontend
          property: hostWithScheme

  # ── React Frontend ───────────────────────────────────────────────
  - type: static
    name: claro-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: claro-backend
          property: hostWithScheme
        format: "%s/api"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
